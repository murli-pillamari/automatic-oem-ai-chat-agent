services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: oem-ai-backend
    restart: always
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      SQLITE_DB_PATH: /app/data/crm_agent.db
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./server/data:/app/data

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: oem-ai-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
